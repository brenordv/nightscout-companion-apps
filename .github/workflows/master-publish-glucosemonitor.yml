name: Glucose Monitor Function App CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-using-template:
    uses: ./.github/workflows/template-test-build-and-publish-to-azure.yml
    with:
      dotnetVersion: '10.0.x'
      targetPlatform: win-x64
      targetRuntime: net10.0
      projectFolder: Raccoon.Ninja.Fn.GlucoseMonitor
      projectFile: Raccoon.Ninja.Fn.GlucoseMonitor.csproj
      releaseFilePrefix: "AzFnGlucoseMonitor"
      publishToAzure: true
    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}
      azureFunctionAppName: ${{ secrets.AZFN_GLUCOSE_MONITOR_APP_NAME }}
      azurePublishProfile: ${{ secrets.AZFN_GLUCOSE_MONITOR_PUBLISH_PROFILE }}
