name: Monthly SonarCloud Analysis

on:
  schedule:
    # Runs at 2 AM UTC on the 1st of every month
    # This will help keep me being on top of any new security issue. :)
    - cron: '0 2 1 * *'

permissions:
  contents: read

jobs:
  sonarcloud-analysis:
    uses: ./.github/workflows/template-qa-sonarcloud.yml
    with:
      projectKey: 'brenordv_nightscout-companion-apps'
      organization: 'raccoon-ninja'
      branchName: 'master'
      verbose: true
      sonarExclusions: '**/*Response.cs,**/*Usings.cs,Raccoon.Ninja.TestHelpers/*'
      coverageExclusions: '**/*Usings.cs,Raccoon.Ninja.TestHelpers/*,**/*Program.cs,Raccoon.Ninja.Fn.GlucoseMonitor/*Func.cs'

    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}
      sonarToken: ${{ secrets.SONAR_TOKEN }}
