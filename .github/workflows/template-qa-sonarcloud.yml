name: SonarCloud Analysis Template
on:
  workflow_call:
    inputs:
      projectKey:
        description: '[Required] SonarCloud project key.'
        required: true
        type: string
      organization:
        description: '[Required] SonarCloud organization.'
        required: true
        type: string
      branchName:
        description: 'Branch to run analysis on. (Defaults to the current branch if not specified.)'
        required: false
        type: string
      verbose:
        description: 'Enable verbose logging for SonarCloud analysis. (Default: true)'
        required: false
        type: boolean
        default: true
      sonarExclusions:
        description: 'Files and directories to exclude from SonarCloud analysis. (Default: empty)'
        required: false
        type: string
        default: ''
      coverageExclusions:
        description: 'Files and directories to exclude from coverage. (Default: empty)'
        required: false
        type: string
        default: ''
    secrets:
      githubToken:
        description: '[Required] GitHub token for PR information and checkouts.'
        required: true
      sonarToken:
        description: '[Required] SonarCloud token for authentication.'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - name: Installing dotnet-coverage
        shell: powershell
        run: dotnet tool install --global dotnet-coverage --version 18.11.0

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin' # AdoptOpenJDK is now Eclipse Temurin

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.branchName }}

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner --version 11.3.0

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.githubToken }}
          SONAR_TOKEN: ${{ secrets.sonarToken }}
          SONAR_PROJECT_KEY: ${{ inputs.projectKey }}
          SONAR_ORG: ${{ inputs.organization }}
          SONAR_VERBOSE: ${{ inputs.verbose }}
          SONAR_EXCLUSIONS: ${{ inputs.sonarExclusions }}
          SONAR_COVERAGE_EXCLUSIONS: ${{ inputs.coverageExclusions }}
        shell: powershell
        run: |
          $scannerArgs = @(
            "/k:$env:SONAR_PROJECT_KEY",
            "/o:$env:SONAR_ORG",
            "/d:sonar.token=$env:SONAR_TOKEN",
            "/d:sonar.host.url=https://sonarcloud.io",
            "/d:sonar.verbose=$env:SONAR_VERBOSE",
            "/d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:SONAR_EXCLUSIONS)) {
            $scannerArgs += "/d:sonar.exclusions=$env:SONAR_EXCLUSIONS"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:SONAR_COVERAGE_EXCLUSIONS)) {
            $scannerArgs += "/d:sonar.coverage.exclusions=$env:SONAR_COVERAGE_EXCLUSIONS"
          }
          .\.sonar\scanner\dotnet-sonarscanner begin @scannerArgs
          dotnet build --configuration Release
          dotnet-coverage collect "dotnet test" -f xml -o "coverage.xml"
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token=$env:SONAR_TOKEN
